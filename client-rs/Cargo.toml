[package]
name = "clicklog"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fire-and-forget telemetry to a clicklog gateway (POST /v1/events), with an optional log tee and Actix Web middleware"
repository = "https://github.com/frdcmp/clicklog"
readme = "README.md"
publish = false

[features]
default = []
# Tee `log` records (warn and error) into telemetry: clicklog::log
log = ["dep:log"]
# Actix Web access-log middleware and the browser-error endpoint: clicklog::actix
actix = ["dep:actix-web"]
# HTTPS to the gateway (a public ingest host); http needs neither
rustls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
log = { version = "0.4", optional = true, features = ["std"] }
actix-web = { version = "4", optional = true, default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
actix-web = { version = "4", default-features = false, features = ["macros"] }
