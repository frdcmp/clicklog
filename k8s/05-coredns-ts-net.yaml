# CLUSTER-WIDE DNS, not a clicklog resource — it lives here because clicklog is
# what needs it, and it is recorded in the cluster architecture note.
#
# Pods resolve through CoreDNS, which forwards anything outside cluster.local to
# the node's resolver. That resolver does not answer MagicDNS names, so a pod
# could reach a tailnet service only by its 100.x address. This zone forwards
# ts.net to the tailnet resolver, so a pod and a machine on the tailnet resolve
# the same name to the same service:
#     clicklog-ingest.__TAILNET__ -> the ingest gateway
#     clicklog.__TAILNET__        -> the admin dashboard
# Apps then carry a name instead of an address, and a service that is given a
# new tailnet IP needs no config change anywhere.
#
# k3s owns the Corefile and imports */*.server from this ConfigMap, which is why
# the zone is added here rather than by editing the Corefile (k3s rewrites it on
# every start).
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  ts-net.server: |
    ts.net:53 {
        errors
        cache 30
        forward . 100.100.100.100
    }
