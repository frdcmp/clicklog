# CLUSTER-WIDE DNS, not a clicklog resource — it lives here because clicklog is
# what first needed it, and it is recorded in the cluster architecture note.
#
# k3s owns the Corefile and rewrites it on every start, but it imports
# `*.server` files from this ConfigMap. Zones therefore go here rather than into
# a file k3s will overwrite.
#
# Both keys are required. Applying this manifest REPLACES the ConfigMap, so
# dropping either one silently removes that zone from the cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  # ── Overlay name resolution for pods ──────────────────────────────────────
  # Pods resolve through CoreDNS, which forwards anything outside cluster.local
  # to the node's resolver — and that resolver does not answer MagicDNS. Without
  # this zone a pod can reach an overlay service only by its 100.x address,
  # while every machine on the overlay uses the name. Forwarding the zone to the
  # overlay resolver makes both resolve the same name to the same service:
  #     clicklog-ingest.__TAILNET__ -> the ingest gateway
  #     clicklog.__TAILNET__        -> the admin dashboard
  # Apps then carry a name instead of an address, and a service given a new
  # overlay address needs no config change anywhere.
  ts-net.server: |
    ts.net:53 {
        errors
        cache 30
        forward . 100.100.100.100
    }

  # ── Keep the ACME client on IPv4 ──────────────────────────────────────────
  # The overlay operator's Ingress proxies fetch the Let's Encrypt ACME API from
  # the pod network, which is IPv4-only. DNS returns an AAAA alongside the A, the
  # proxy dials the AAAA, and issuance fails with `network is unreachable` — no
  # certificate is issued and TLS handshakes then fail with no HTTP status to
  # read. Certificates renew through this same path, so without this zone every
  # HTTPS Ingress in the cluster fails at renewal rather than at creation.
  #
  # NOERROR with no answer section is a NODATA reply: the name exists but holds
  # no AAAA, so only the A record is left and the dial has nowhere wrong to go.
  # Scoped to Let's Encrypt's API on purpose — nothing else changes behaviour.
  letsencrypt-ipv4.server: |
    api.letsencrypt.org:53 {
        errors
        template IN AAAA {
            rcode NOERROR
        }
        cache 30
        forward . /etc/resolv.conf
    }
